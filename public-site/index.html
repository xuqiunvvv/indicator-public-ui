<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="选X指标公开版本，只读查询与指标明细">
  <title>选X指标中心 · 只读版</title><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">X</span><div><strong>选X指标中心</strong><small>公开版本 · 只读查询</small></div></div><span class="readonly-badge">只读访问</span></header>
  <main>
    <section class="heading"><div><p class="eyebrow">INDICATOR DIRECTORY</p><h1>查找你需要的指标</h1><p class="muted">仅展示已发布的公开版本，不连接管理系统工作数据。</p></div><label class="domain-label">当前范式<select id="domainSelect" aria-label="选择范式" disabled></select></label></section>
    <section class="version-bar" aria-live="polite"><div><span id="domainName">正在读取公开版本</span><strong id="version">—</strong></div><div class="version-meta"><span id="counts"></span><span id="publishedAt"></span></div></section>
    <section class="catalog">
      <div class="toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索指标名称、编码、DS接口ID、别名或介绍" aria-label="搜索指标"></label><select id="l1" aria-label="一级分类"><option value="">全部一级分类</option></select><select id="l2" aria-label="二级分类"><option value="">全部二级分类</option></select><select id="status" aria-label="指标状态"><option value="">全部状态</option><option>有效</option><option>已废弃</option></select><button id="reset" class="text-button">重置</button></div>
      <p id="message" class="message" role="status">正在加载…</p>
      <div class="table-wrap"><table><thead><tr><th>指标编码</th><th>DS接口ID</th><th>指标名称</th><th>指标分类</th><th>指标类型</th><th>频率</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="table-footer"><span id="resultCount" aria-live="polite"></span><div class="page-controls"><label>每页 <select id="pageSize" aria-label="每页条数"><option>20</option><option>50</option><option>100</option></select> 条</label><button id="prev" aria-label="上一页">上一页</button><span id="pageLabel"></span><button id="next" aria-label="下一页">下一页</button></div></div>
    </section>
    <footer class="footnote">静态快照 · 数据仅在站点重新发布时更新 · 无编辑、导入或删除功能</footer>
  </main>
  <dialog id="detailDialog" aria-labelledby="detailName"><header class="dialog-heading"><div><span id="detailCode" class="muted"></span><h2 id="detailName"></h2></div><button id="closeDetail" aria-label="关闭指标明细">×</button></header><div class="dialog-body"><dl id="detailSummary"></dl><section><h3>别名 / 同义词</h3><p id="detailSynonyms" class="prose"></p></section><section><h3>指标介绍</h3><p id="detailDescription" class="prose"></p></section><section><h3>标准参数</h3><div class="param-tabs" role="tablist" aria-label="参数类型"><button id="tab-time" role="tab" aria-controls="detailJson" aria-selected="true" data-param="time">时间型入参</button><button id="tab-enum" role="tab" aria-controls="detailJson" aria-selected="false" data-param="enum" tabindex="-1">枚举型入参</button><button id="tab-custom" role="tab" aria-controls="detailJson" aria-selected="false" data-param="custom" tabindex="-1">自定义入参</button><button id="tab-output" role="tab" aria-controls="detailJson" aria-selected="false" data-param="output" tabindex="-1">出参项</button></div><pre id="detailJson" role="tabpanel" aria-labelledby="tab-time" tabindex="0"></pre></section></div></dialog>
  <script type="module" src="./app.js"></script>
</body></html>
